<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fight Matrix — Upcoming Card</title>
<style>
  :root{
    --fg:#e8e8ea; --dim:#9aa0ab; --bg:#14161a; --row:#1b1e24; --row2:#202430;
    --line:#2c313c; --fav:#7fd1a3; --dog:#e6a06b; --win:#3a8f5e; --loss:#b4503f;
    --accent:#6aa6ff; --chip:#2a2f3a;
    --gold:#d4af37; --gold-dim:#9c802a; --gold-soft:rgba(212,175,55,.14);
    --f: 11px; --fs: 10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:var(--f);line-height:1.25}
  a{color:inherit;text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1200px;margin:0 auto;padding:8px 10px 60px}
  header.ev{display:flex;align-items:baseline;gap:12px;padding:6px 4px 10px;border-bottom:1px solid var(--line)}
  header.ev h1{font-size:15px;margin:0;font-weight:650}
  header.ev .date{color:var(--dim)}
  header.ev .legend{margin-left:auto;color:var(--dim);font-size:var(--fs)}
  header.ev .legend b{color:var(--fg)}

  /* one bout per card: metallic gold border, rounded, spaced apart */
  #card{display:flex;flex-direction:column;gap:14px;padding-top:12px}
  .bout{border:1px solid transparent;border-radius:10px;background:var(--row);
    overflow:hidden;
    background-image:
      linear-gradient(var(--row),var(--row)),
      linear-gradient(140deg,#7a5f16 0%,#e9d27a 22%,#b8932b 42%,#f6e9a8 55%,#9c7d1e 78%,#caa233 100%);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 2px 12px rgba(0,0,0,.4)}
  .bout > .summary{display:grid;grid-template-columns:1fr 30px 1fr;align-items:stretch;cursor:pointer}
  .bout > .summary:hover{background:rgba(255,255,255,.02)}
  .half{padding:4px 8px;min-width:0}
  .half.dog{border-left:1px solid var(--line)}
  .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);font-size:var(--fs)}
  .mid .wt{background:var(--chip);border-radius:8px;padding:1px 6px;color:var(--fg)}
  .mid .tw{margin-top:2px;font-size:9px}

  /* line 1: ranks | abbr | name | odds */
  .l1{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
  .ranks{display:inline-flex;align-items:center;font-variant-numeric:tabular-nums;
    border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .ranks .rk{padding:0 4px;border-right:1px solid var(--line);color:var(--dim);font-size:var(--fs);min-width:18px;text-align:center}
  .ranks .rk:last-child{border-right:0}
  .ranks .rk.fm{color:var(--fg);font-weight:700}
  .ranks .rk.whr{color:var(--fg);font-weight:700;min-width:28px;font-variant-numeric:tabular-nums}
  .ranks .rk.na{color:#555}
  .abbr{color:var(--dim);font-size:var(--fs);min-width:26px}
  .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis}
  .half.fav .nm{color:var(--fav)} .half.dog .nm{color:var(--dog)}
  .odds-wrap{margin-left:auto;display:flex;align-items:baseline;gap:5px;white-space:nowrap}
  .odds{font-variant-numeric:tabular-nums;font-weight:700}      /* DraftKings, primary */
  .odds.neg{color:var(--fav)} .odds.pos{color:var(--dog)}
  .best{font-size:9px;color:#717784;font-variant-numeric:tabular-nums}  /* best, faded */
  .best .bk{color:#565c68;font-size:8px}

  /* expanded per-book odds bar (full-width band, two halves) */
  .obwrap{display:flex;align-items:stretch;background:#0c0e12;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .bout.open .history .ob{flex:1 1 0;min-width:0;min-height:34px;padding:7px 9px;
    font-size:9.5px;line-height:1.7;color:var(--dim);white-space:normal;overflow-wrap:anywhere}
  .ob.dog{border-left:1px solid var(--line);text-align:right}
  .ob .dk{color:var(--fg);font-weight:700}
  .ob .bestmark{color:var(--accent)}

  /* lines 2-4: method-split records */
  .rec{color:var(--dim);font-size:var(--fs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .rec .tot{color:var(--fg);font-weight:650}
  .rec .tag{display:inline-block;color:var(--accent);font-weight:700;margin-right:2px}
  .rec b{color:#cfd4dd;font-weight:600}

  /* expanded dual history — shared time-aligned timeline, both fighters side by side */
  .history{display:none;border-top:1px solid var(--gold-dim);background:#0f1115}
  .bout.open .history{display:block}
  .tlhead{display:flex;align-items:stretch;background:#0c0e12;border-bottom:1px solid var(--line)}
  .th{flex:1 1 0;min-width:0;padding:5px 9px;font-size:10px;font-weight:800;
    letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .th.fav{color:var(--fav)}
  .th.dog{color:var(--dog);text-align:right}
  .th.axis{flex:0 0 34px;padding:0;
    background:linear-gradient(180deg,rgba(212,175,55,.12),rgba(212,175,55,.04))}
  .tl{display:flex;align-items:stretch}              /* three real columns */
  .col{position:relative;flex:1 1 0;min-width:0;padding:4px 6px;box-sizing:border-box}
  .col.fav{border-right:1px solid var(--line)}
  .col.dog{border-left:1px solid var(--line)}
  .axis{position:relative;flex:0 0 34px;background:rgba(212,175,55,.05)}
  .tlwrap{position:relative;width:100%}
  /* each fight = a fixed-height card slot, absolutely placed by its real date */
  .fx{position:absolute;left:0;right:0;height:42px;overflow:hidden;
    padding:3px 6px;border:1px solid var(--line);border-radius:5px;
    background:#16191f;box-sizing:border-box}
  .fx .meta{display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
  .fx .res{font-weight:800;min-width:15px;height:14px;line-height:14px;text-align:center;
    border-radius:3px;color:#0c0d10;font-size:9px;flex:none}
  .fx .res.W{background:var(--win);color:#eafff1} .fx .res.L{background:var(--loss);color:#fff}
  .fx .res.D,.fx .res.NC{background:#5a5f6b;color:#fff}
  .fx .d{color:var(--gold);font-size:9px;font-variant-numeric:tabular-nums;flex:none}
  .fx .opp{font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .fx .orank{color:var(--accent);font-size:9px;flex:none}
  .fx .mth{color:var(--dim);font-size:9px;display:block;margin-top:2px;margin-left:20px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gapnote{position:absolute;left:50%;transform:translateX(-50%);color:var(--gold-dim);
    font-size:9px;white-space:nowrap}
  .empty{color:#555;padding:8px}

  /* recommended-bet badge */
  .half.fav.picked{box-shadow:inset 3px 0 0 var(--gold)}
  .half.dog.picked{box-shadow:inset -3px 0 0 var(--gold)}

  /* METALLIC GOLD PICK BANNER — single compact line across the top */
  .pickbar{display:flex;align-items:center;flex-wrap:nowrap;gap:0 8px;
    padding:4px 10px;font-size:10.5px;line-height:1.25;white-space:nowrap;overflow:hidden;
    color:#241c02;border-bottom:1px solid #7a5f16;border-radius:9px 9px 0 0;
    text-shadow:0 1px 0 rgba(255,255,255,.25);
    background:
      linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 18%,rgba(0,0,0,.12) 100%),
      linear-gradient(95deg,#a9851f 0%,#e9d27a 14%,#caa233 30%,#f6e9a8 47%,#c79a2b 60%,#e8cf73 78%,#9c7d1e 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.25)}
  .pickbar .tag{font-weight:900;letter-spacing:.5px;color:#1a1304;flex:none}
  .pickbar .b{color:#000;font-weight:800;overflow:hidden;text-overflow:ellipsis}
  .pickbar .o{font-variant-numeric:tabular-nums;font-weight:900;flex:none;
    padding:0 5px;border-radius:4px;background:rgba(0,0,0,.18)}
  .pickbar .o.neg{color:#06351c} .pickbar .o.pos{color:#5a2a00}
  .pickbar .m{color:#3d3208;font-weight:600;flex:none}
  .pickbar span.b{flex:1 1 auto;min-width:0}
  .pickbar .ev{color:#06351c;font-weight:800;flex:none}
  .pickbar span:nth-child(n+5){margin-left:0}
  .pickbar > span:not(.b):not(.tag){flex:none}
  .pickbar .slate{margin-left:auto;color:#1a1304;font-weight:800;flex:none}
  /* PARLAY banner: multi-line — header row, then one row per leg */
  .pickbar.parlay{
    display:block;flex-wrap:initial;white-space:normal;overflow:visible;
    padding:5px 10px 6px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 14%,rgba(0,0,0,.12) 100%),
      linear-gradient(95deg,#8f7424 0%,#d9c489 14%,#b6973f 32%,#ecdca6 48%,#b39548 62%,#d4bf80 80%,#8a6f22 100%)}
  .pickbar.parlay .pl-head{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;
    white-space:nowrap}
  .pickbar.parlay .pl-head .b{flex:0 1 auto}
  .pickbar.parlay .tag{color:#2e2305}
  .pickbar.parlay .pl-legs{display:block;margin-top:3px;
    border-top:1px solid rgba(0,0,0,.22);padding-top:3px}
  .pickbar.parlay .pleg{display:flex;align-items:baseline;gap:6px;
    font-size:10px;font-weight:700;color:#241c02;line-height:1.5;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .pickbar.parlay .pleg .legn{flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.25);color:#f3e6b0;
    font-size:8.5px;font-weight:900}
  .pickbar.parlay .pleg .legt{overflow:hidden;text-overflow:ellipsis}
  /* DK prop menu row (expanded) */
  .bout.open .history .props{display:flex;flex-wrap:wrap;gap:3px 14px;
    padding:3px 8px;font-size:9px;color:var(--dim);border-bottom:1px solid var(--line);background:#0f1115}
  .props b{color:#cfd4dd;font-variant-numeric:tabular-nums} .props .lbl{color:#6a7180;text-transform:uppercase;letter-spacing:.4px}
  .modelbar{padding:3px 10px;font-size:10px;color:var(--dim);white-space:normal;line-height:1.4;border-top:1px solid var(--line);background:rgba(106,166,255,.06)}
  .modelbar b{color:var(--fg)} .modelbar .mdot{color:#444}

  /* ===================== RESPONSIVE / MOBILE ===================== */
  /* Allow long names/records to wrap instead of being clipped everywhere. */
  @media (max-width: 640px){
    :root{ --f:13px; --fs:11px; }
    .wrap{ padding:8px 8px 48px; }

    header.ev{ flex-wrap:wrap; gap:4px 10px; padding:6px 2px 8px; }
    header.ev h1{ font-size:16px; flex:1 1 100%; }
    header.ev .legend{ margin-left:0; flex:1 1 100%; line-height:1.35; }

    /* Stack the two fighters vertically; weight chip becomes a divider band. */
    .bout > .summary{ grid-template-columns:1fr; }
    .half{ padding:8px 10px; }
    .half.dog{ border-left:0; border-top:1px solid var(--line); }
    .half.fav.picked{ box-shadow:inset 0 3px 0 var(--gold); }
    .half.dog.picked{ box-shadow:inset 0 -3px 0 var(--gold); }

    .mid{
      grid-row:auto; flex-direction:row; gap:6px;
      padding:3px 10px; background:#0f1115;
      border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    }
    .mid .tw{ margin-top:0; }

    /* Line 1 may wrap; odds drop to their own right-aligned row. */
    .l1{ flex-wrap:wrap; white-space:normal; row-gap:2px; }
    .nm{ white-space:normal; flex:1 1 auto; }
    .odds-wrap{ flex-basis:100%; justify-content:flex-end; margin-left:0; }

    /* Records: let them wrap to multiple lines rather than truncate. */
    .rec{ white-space:normal; line-height:1.4; }

    /* Pick banner stays a single line on mobile too (JS abbreviates to fit). */
    .pickbar{ padding:4px 9px; font-size:10px; }

    /* Per-book odds: keep the two halves side by side, just smaller. */
    .obwrap{ flex-direction:row; }
    .history .ob{ font-size:8.5px; line-height:1.5; padding:6px 6px; min-height:30px; }
    .ob.dog{ text-align:right; border-left:1px solid var(--line); border-top:0; }
    .props{ white-space:normal; font-size:8.5px; }

    /* History ALWAYS side-by-side (never stacks) — the shared time ruler is
       preserved; we only shrink type/padding so both columns fit any phone,
       portrait or landscape. */
    .tl{ flex-direction:row; }
    .col{ padding:4px 4px; }
    .col.fav{ border-right:1px solid var(--line); }
    .col.dog{ border-left:1px solid var(--line); border-top:0; }
    .col::before{ content:none; }            /* no stacked-list headers */
    .axis{ display:block; flex:0 0 18px; }   /* keep narrow shared axis */
    .th{ font-size:9px; padding:5px 6px; }
    .th.axis{ flex:0 0 18px; }
    .gapnote{ font-size:7.5px; }
    .fx{ left:2px; right:2px; padding:2px 4px; font-size:9px; }
    .fx .meta{ gap:3px; }
    .fx .res{ min-width:13px; height:13px; line-height:13px; font-size:8px; }
    .fx .d{ font-size:8px; }
    .fx .orank{ font-size:8px; }
    .fx .mth{ font-size:8px; margin-left:16px; }
  }

  /* Mid-size tablets: ease the fixed micro font up a touch. */
  @media (min-width: 641px) and (max-width: 900px){
    :root{ --f:12px; --fs:10.5px; }
  }
</style>
</head>

const SYS = ["FM","EloK","EloM","Glk","WHR","Model"];
const BOOK_ABBR = {DraftKings:"DK",FanDuel:"FD",BetMGM:"MGM",Caesars:"CZR",Fanatics:"FAN",Bet365:"365"};

// Uniform timeline scale shared by EVERY bout card on the page, so a fight's
// vertical position reflects its real date on one consistent monthly ruler.
// ---- bout-history timeline geometry ----
// Cross-side vertical offset scales with the date gap between a favorite fight
// and an underdog fight: 0 days -> perfectly in line (overlap), 365 days -> one
// full fight-height offset (borders in line), capped beyond a year. Same-side
// consecutive fights are merely stacked with slim padding (never overlap).
const FX_H    = 42;        // visual height of a fight card (matches .fx height in CSS)
const ROW_PAD = 6;         // slim padding between consecutive SAME-side fights
const YEAR_PX = FX_H;      // cross-side offset at exactly 365 days = one fight height
const DAY_MS  = 86400000;

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function oddsStr(o){return o==null?"":(o>0?"+"+o:""+o);}
function rec3(r){return r? r[0]+"-"+r[1]+"-"+r[2] : null;}

// one method-split records line, omitting empty buckets
function recLine(tag, rs){
  if(!rs || !rs.tot || (rs.tot[0]+rs.tot[1]+rs.tot[2])===0) return null;
  const parts=[];
  if(tag) parts.push('<span class="tag">'+tag+'</span>');
  parts.push('<span class="tot">'+rec3(rs.tot)+'</span>');
  const order=[["KO","ko"],["Sub","sub"],["Dec","dec"],["UD","ud"],["SD","sd"]];
  for(const [lbl,k] of order){
    const r=rs[k]; if(r && (r[0]+r[1]+r[2])>0) parts.push(lbl+': <b>'+rec3(r)+'</b>');
  }
  const d=el("div","rec"); d.innerHTML=parts.join(' <span style="color:#444">|</span> '); return d;
}

// The in-house model rank (index 5, round-robin division rank by opponent-adjusted
// Elo) is the primary badge; falls back to WHR (index 4) if a fighter is outside
// the model universe. Other systems stay in the data for easy re-enable.
function rankStrip(ranks){
  const s=el("span","ranks");
  const model = ranks && ranks[5]!=null ? ranks[5] : null;   // index 5 = in-house model
  const whr   = ranks && ranks[4]!=null ? ranks[4] : null;   // index 4 = WHR fallback
  const v = model!=null ? model : whr;
  const c=el("span","rk whr"+(v==null?" na":""), v==null?"#·":"#"+v);
  c.title=(model!=null
    ? "Model rank #"+v+" (in-house XGBoost; beats WHR head-to-head)"
    : (whr!=null ? "WHR #"+v+" (model fallback — outside model universe)" : "unranked"));
  s.appendChild(c);
  return s;
}

// DraftKings primary (current colors/position) + best faded beside it
function oddsWrap(f){
  const ow=el("div","odds-wrap");
  const dk=f.dk, best=f.best, fm=f.fm_odds;
  const primary = dk!=null ? dk : (fm!=null ? fm : best);
  if(primary==null){ ow.appendChild(el("span","best","no line")); return ow; }
  if(dk!=null && best!=null && best!==dk){          // a different book beats DK
    const bk=BOOK_ABBR[f.best_book]||"";
    const s=el("span","best",'<span class="bk">best </span>'+oddsStr(best)+(bk?' <span class="bk">'+bk+'</span>':''));
    s.title="best available: "+oddsStr(best)+(f.best_book?" at "+f.best_book:"");
    ow.appendChild(s);
  }
  const o=el("span","odds "+(primary<0?"neg":"pos"),oddsStr(primary));
  o.title=(dk!=null?"DraftKings":(fm!=null?"FightMatrix":"best"))+" "+oddsStr(primary);
  ow.appendChild(o);
  return ow;
}

// all books for one fighter, DraftKings emphasized + best flagged (expanded view)
function bookRow(f){
  const parts=[];
  for(const b of BOOK_ORDER){
    const v=f.books?f.books[b]:null; if(v==null) continue;
    const cls=(b==="DraftKings")?"dk":"";
    parts.push('<span class="'+cls+'">'+(BOOK_ABBR[b]||b)+' '+oddsStr(v)+'</span>');
  }
  if(f.best!=null) parts.push('<span class="bestmark">best '+oddsStr(f.best)+(f.best_book?' '+(BOOK_ABBR[f.best_book]||''):'')+'</span>');
  return parts.length?parts.join(' · '):'no odds';
}

// recommended bet badge (always visible under a bout). singles + parlay legs.
// Abbreviate market/bet phrasing for the compact one-line banner.
function abbrPhrase(s){
  if(!s) return s;
  let t=s;
  t=t.replace(/\bUnanimous Decision\b/gi,"UD")
     .replace(/\bSplit Decision\b/gi,"SD")
     .replace(/\bSubmission\b/gi,"SUB")
     .replace(/\bMoneyline\b/gi,"ML")
     .replace(/\bDecision\b/gi,"DEC")
     .replace(/\binside distance\b/gi,"inside dist")
     .replace(/\bby finish\b/gi,"by fin")
     .replace(/\bRounds?\b/g,"Rd")
     .replace(/^Win\b/,"W")
     .replace(/^Fight ends by\b/i,"Ends by");
  return t;
}
// Drop a fighter's first name(s), keep the surname, preserve any trailing
// " by X" / " ML" qualifier. "Leon Shahbazyan by Submission" -> "Shahbazyan by Sub".
function abbrBet(s){
  if(!s) return s;
  const m=s.match(/^(.*?)(\s+(?:by|ML|to)\b.*)?$/i);
  let name=m?m[1]:s, tail=m&&m[2]?m[2]:"";
  // if the leading part looks like a person's name (2+ capitalized words), keep last word
  const words=name.trim().split(/\s+/);
  if(words.length>=2 && /^[A-Z]/.test(words[0]) && /^[A-Z]/.test(words[words.length-1])){
    name=words[words.length-1];
  }
  return abbrPhrase((name+tail).trim());
}

// Collect every leg belonging to a parlay (across all bouts sharing the label),
// in card order, deduplicated.
function parlayLegs(label){
  const out=[], seen=new Set();
  (DATA.bouts||[]).forEach(b=>{
    const pk=b.pick;
    if(pk && pk.parlay && pk.label===label && pk.leg && !seen.has(pk.leg)){
      seen.add(pk.leg); out.push(pk.leg);
    }
  });
  return out;
}

function pickBar(p){
  const d=el("div","pickbar "+(p.conviction||"med")+(p.parlay?" parlay":""));
  d.title=p.thesis||"";
  const stat='<span>P '+Math.round(p.prob*100)+'%</span>'
    +'<span class="ev">EV '+(p.ev_pct>=0?"+":"")+p.ev_pct+'%</span>'
    +'<span class="slate" title="log-optimal slate share (fully invested, 5% floor)">slate '+p.slate_alloc_pct+'%</span>';
  const odds='<span class="o '+(p.dk_odds<0?"neg":"pos")+'">'+oddsStr(p.dk_odds)+'</span>';
  if(p.parlay){
    // Multi-line: a header row, then one row per leg (one per fight in the parlay).
    const legs=parlayLegs(p.label);
    const legRows=legs.map((lg,i)=>
      '<div class="pleg"><span class="legn">'+(i+1)+'</span><span class="legt">'+lg+'</span></div>'
    ).join("");
    d.innerHTML=
      '<div class="pl-head">'
        +'<span class="tag">PARLAY ▸</span>'
        +'<span class="b">'+p.label+'</span>'+odds
        +'<span class="m">'+p.market+'</span>'+stat
      +'</div>'
      +'<div class="pl-legs">'+legRows+'</div>';
    return d;
  }
  const betF=p.bet, betA=abbrBet(p.bet);
  const mF=p.market, mA=abbrPhrase(p.market);
  d.innerHTML='<span class="tag">PICK ▸</span>'
    +'<span class="b" data-full="'+betF+'" data-abbr="'+betA+'">'+betF+'</span>'+odds
    +'<span class="m" data-full="'+mF+'" data-abbr="'+mA+'">'+mF+'</span>'+stat;
  return d;
}

// After layout, if a single-pick banner's bet text is truncated, compact it:
// 1) abbreviate bet+market, 2) hide the .m label. Parlays are multi-line, skipped.
function fitPickBars(root){
  const bars=(root||document).querySelectorAll(".pickbar:not(.parlay)");
  bars.forEach(bar=>{
    const b=bar.querySelector(".b");
    const m=bar.querySelector(".m");
    if(b) b.textContent=b.getAttribute("data-full");          // reset to full first
    if(m){ m.textContent=m.getAttribute("data-full"); m.style.display=""; }
    // overflow if the bet text itself is clipped OR the whole bar overruns
    const over=()=> (b && b.scrollWidth>b.clientWidth+1) || bar.scrollWidth>bar.clientWidth+1;
    if(!over()) return;
    if(b) b.textContent=b.getAttribute("data-abbr");           // 1) abbreviate
    if(m) m.textContent=m.getAttribute("data-abbr");
    if(!over()) return;
    if(m) m.style.display="none";                              // 2) drop market label
  });
}

// DraftKings prop menu for a bout (method / distance / total rounds)
function propsBar(mk){
  if(!mk) return null;
  const parts=[];
  const m=mk.method||{};
  const ms=["KO/TKO","Submission","Decision","Draw"].filter(k=>m[k]!=null).map(k=>k+' <b>'+m[k]+'</b>').join(' · ');
  if(ms) parts.push('<span class="lbl">method</span> '+ms);
  const d=mk.distance||{};
  if(d.Yes!=null||d.No!=null) parts.push('<span class="lbl">distance</span> Yes <b>'+(d.Yes||"–")+'</b> / No <b>'+(d.No||"–")+'</b>');
  const t=mk.totals||{};
  const tk=Object.keys(t).sort();
  if(tk.length) parts.push('<span class="lbl">rounds</span> '+tk.map(k=>'O/U '+k+' <b>'+(t[k].over||"–")+'</b>/<b>'+(t[k].under||"–")+'</b>').join(' · '));
  if(!parts.length) return null;
  const e=el("div","props"); e.innerHTML=parts.join(' <span style="color:#333">|</span> '); return e;
}

function halfView(f, side, picked){
  const h=el("div","half "+side+(picked?" picked":""));
  // line 1
  const l1=el("div","l1");
  l1.appendChild(rankStrip(f.ranks));
  l1.appendChild(el("span","abbr",f.division_abbr||"—"));
  const nm=el("span","nm",f.name);
  l1.appendChild(nm);
  l1.appendChild(oddsWrap(f));
  h.appendChild(l1);
  // lines 2-4
  for(const [tag,scope] of [["",("all")],["[UFC]","ufc"],["[L3Y]","l3y"]]){
    const line=recLine(tag,f.records&&f.records[scope]); if(line) h.appendChild(line);
  }
  return h;
}

// Place both fighters' fights on one shared vertical ruler.
// Walk the merged (newest-first) sequence of all fights; each step downward is
// proportional to the real days since the previous fight, scaled so 365 days =
// one fight-height and capped there. A per-side floor then guarantees a single
// fighter's consecutive fights are at least touching (slim padding, no overlap),
// while opposite-side fights are free to sit in line / overlap when close in date.
function buildTimeline(A, B){
  const ev=[];
  (A||[]).forEach(f=>{ if(f.date) ev.push({f, side:"F", t:new Date(f.date).getTime()}); });
  (B||[]).forEach(f=>{ if(f.date) ev.push({f, side:"D", t:new Date(f.date).getTime()}); });
  ev.sort((x,z)=> z.t - x.t);                       // newest at top
  let y=0, prevT=null, lastY={F:null, D:null};
  const gaps=[];
  for(const e of ev){
    if(prevT!=null){
      const days=Math.max(0,(prevT - e.t)/DAY_MS);
      const step=YEAR_PX * Math.min(1, days/365);   // 0..FX_H, capped at 1yr
      const yBefore=y;
      y+=step;
      if(days>365) gaps.push({y:yBefore+step/2, d:days});   // mark compressed >1yr layoffs
    }
    const floor = lastY[e.side]!=null ? lastY[e.side]+FX_H+ROW_PAD : null;
    if(floor!=null && y<floor) y=floor;             // same-side: never overlap
    e.y=y;
    lastY[e.side]=y;
    prevT=e.t;
  }
  const maxY=ev.length?Math.max(...ev.map(e=>e.y)):0;
  return {
    placedF: ev.filter(e=>e.side==="F").map(e=>({f:e.f,y:e.y})),
    placedD: ev.filter(e=>e.side==="D").map(e=>({f:e.f,y:e.y})),
    height: maxY+FX_H+4,
    gaps
  };
}

// human label for a capped (>1yr) layoff marker
function gapLabel(days){
  const mo=days/30.4;
  if(mo>=24) return Math.round(mo/12)+"y";
  return Math.round(mo)+"mo";
}

// ---- bout-history abbreviations (applied only when a card's text overflows) ----
function lastName(name){
  if(!name) return name;
  const p=name.trim().split(/\s+/);
  return p.length>1 ? p[p.length-1] : name;
}
function abbrMethod(method){
  if(!method) return method||"";
  const m=method;
  if(/^Decision\s*\(Unanimous\)/i.test(m)) return "UD";
  if(/^Decision\s*\(Split\)/i.test(m))     return "SD";
  if(/^Decision\s*\(Majority\)/i.test(m))  return "MD";
  if(/^Decision/i.test(m))                 return "DEC";
  if(/Submission/i.test(m))                return "SUB";   // incl. Technical Submission
  if(/^TKO/i.test(m))                       return "TKO";
  if(/^KO/i.test(m))                        return "KO";
  if(/No Contest|^NC/i.test(m))            return "NC";
  if(/Disqualification|^DQ/i.test(m))      return "DQ";
  if(/^Draw/i.test(m))                      return "D";
  return m.replace(/\s*\(.*\)\s*$/,"");                    // else strip parenthetical
}
function abbrRound(round){
  if(!round) return "";
  return round.replace(/Round\s*(\d+)/i,"R$1");
}

function fxView(f){
  const x=el("div","fx");
  const meta=el("div","meta");
  meta.appendChild(el("span","res "+f.result,f.result));
  meta.appendChild(el("span","d",f.date||""));
  const oppFull=f.opp||"?";
  const opp=el("span","opp",oppFull);
  opp.setAttribute("data-full",oppFull);
  opp.setAttribute("data-abbr",lastName(oppFull));
  meta.appendChild(opp);
  if(f.opp_rank) meta.appendChild(el("span","orank",f.opp_rank));
  x.appendChild(meta);
  const mFull=[f.method,f.round].filter(Boolean).join(" · ");
  if(mFull){
    const mAbbr=[abbrMethod(f.method),abbrRound(f.round)].filter(Boolean).join(" · ");
    const mth=el("span","mth",mFull);
    mth.setAttribute("data-full",mFull);
    mth.setAttribute("data-abbr",mAbbr);
    x.appendChild(mth);
  }
  return x;
}

// When a fight card's name or method line overflows its column, swap that line
// to its abbreviated form (last name / SUB·DEC·UD·SD·R#). Runs on expand + resize.
function fitHistory(root){
  if(!root) return;
  root.querySelectorAll(".fx").forEach(fx=>{
    const opp=fx.querySelector(".opp");
    if(opp){
      opp.textContent=opp.getAttribute("data-full");
      if(opp.scrollWidth>opp.clientWidth+1) opp.textContent=opp.getAttribute("data-abbr");
    }
    const mth=fx.querySelector(".mth");
    if(mth){
      mth.textContent=mth.getAttribute("data-full");
      if(mth.scrollWidth>mth.clientWidth+1) mth.textContent=mth.getAttribute("data-abbr");
    }
  });
}

function historyView(bout){
  const wrap=el("div","history");
  // DK prop menu (full-width), then per-book moneyline bar (fav | dog)
  const pr=propsBar(bout.dk_markets); if(pr) wrap.appendChild(pr);
  const obw=el("div","obwrap");
  obw.appendChild(el("div","ob fav", bookRow(bout.fav)));
  obw.appendChild(el("div","ob dog", bookRow(bout.dog)));
  wrap.appendChild(obw);

  const A=bout.fav.history||[], B=bout.dog.history||[];
  if(!A.length && !B.length){ wrap.appendChild(el("div","empty","no history")); return wrap; }
  const {placedF,placedD,height,gaps}=buildTimeline(A,B);

  // column header naming each fighter (mirrors the 3-col timeline layout)
  const head=el("div","tlhead");
  head.appendChild(el("div","th fav", bout.fav.name||"Favorite"));
  head.appendChild(el("div","th axis",""));
  head.appendChild(el("div","th dog", bout.dog.name||"Underdog"));
  wrap.appendChild(head);

  const tl=el("div","tl");
  const fav=el("div","col fav"), axis=el("div","axis"), dog=el("div","col dog");
  const tlF=el("div","tlwrap"), tlD=el("div","tlwrap");
  // every height-bearing element shares the SAME pixel height so the three
  // columns line up on one ruler.
  fav.style.height=height+"px"; dog.style.height=height+"px"; axis.style.height=height+"px";
  tlF.style.height=height+"px"; tlD.style.height=height+"px";
  fav.appendChild(tlF); dog.appendChild(tlD);
  for(const p of placedF){ const v=fxView(p.f); v.style.top=p.y+"px"; tlF.appendChild(v); }
  for(const p of placedD){ const v=fxView(p.f); v.style.top=p.y+"px"; tlD.appendChild(v); }
  for(const g of gaps){ const n=el("div","gapnote","· "+gapLabel(g.d)+" ·"); n.style.top=g.y+"px"; axis.appendChild(n); }
  tl.appendChild(fav); tl.appendChild(axis); tl.appendChild(dog);
  wrap.appendChild(tl);
  return wrap;
}

// in-house model's head-to-head read on this matchup (P(fav) vs P(dog))
function modelBar(bout){
  if(bout.model_fav==null) return null;
  const f=bout.model_fav, d=Math.round((100-f)*10)/10;
  const bar=el("div","modelbar");
  bar.innerHTML='<b>Model</b> '+bout.fav.name+' <b>'+f+'%</b>'
    +' <span class="mdot">·</span> '+bout.dog.name+' <b>'+d+'%</b>';
  return bar;
}

function boutView(bout){
  const b=el("div","bout");
  if(bout.pick) b.appendChild(pickBar(bout.pick));   // gold banner across the top
  const sum=el("div","summary");
  const side=bout.pick&&bout.pick.side;
  sum.appendChild(halfView(bout.fav,"fav", side&&side===bout.fav.name));
  const mid=el("div","mid");
  mid.appendChild(el("span","wt",(bout.weight||"")+""));
  mid.appendChild(el("span","tw","lbs"));
  sum.appendChild(mid);
  sum.appendChild(halfView(bout.dog,"dog", side&&side===bout.dog.name));
  b.appendChild(sum);
  const mb=modelBar(bout); if(mb) b.appendChild(mb);
  let built=false, hv=null;
  sum.addEventListener("click",e=>{
    if(!built){ hv=historyView(bout); b.appendChild(hv); built=true; }
    const opening=!b.classList.contains("open");
    b.classList.toggle("open");
    if(opening) fitHistory(hv);   // measure only once visible
  });
  return b;
}

function render(){
  document.getElementById("ev-name").textContent = DATA.event?.name || "—";
  document.getElementById("ev-date").textContent = DATA.event?.date || "";
  const card=document.getElementById("card");
  (DATA.bouts||[]).forEach(b=>card.appendChild(boutView(b)));
  fitPickBars(card);
}
render();

// Re-fit every banner + any open history. Pickbars reset to full text first so a
// wider layout restores the un-abbreviated version. Debounced.
let _fitT=null;
function refitAll(){
  clearTimeout(_fitT);
  _fitT=setTimeout(()=>{
    fitPickBars(document);
    document.querySelectorAll(".bout.open .history").forEach(h=>fitHistory(h));
  },60);
}
// The artifact frame often settles its width AFTER first paint, and a plain
// resize event isn't always delivered — so observe the container directly and
// also re-fit on the next frame and on load.
window.addEventListener("resize", refitAll);
window.addEventListener("load", refitAll);
requestAnimationFrame(()=>{ fitPickBars(document); requestAnimationFrame(refitAll); });
if(window.ResizeObserver){
  const ro=new ResizeObserver(refitAll);
  ro.observe(document.documentElement);
  const card=document.getElementById("card");
  if(card) ro.observe(card);
}
</script>
</body>
</html>
